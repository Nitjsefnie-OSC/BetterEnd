name: Manual CI

# Fork-only dispatch wrapper (Nitjsefnie-OSC): validates an arbitrary ref with
# the repository's own checks. Not part of upstream CI.

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: Git ref to validate
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: osc-manual-${{ inputs.target_ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: osc-validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.target_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Provenance
        run: |
          echo "osc-manual target_ref=${{ inputs.target_ref }}"
          echo "osc-manual sha=$(git rev-parse HEAD)"

      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Run datagen
        run: ./gradlew runDatagenClient --no-daemon

      - name: Generated tree matches datagen output
        run: git diff --exit-code src/main/generated

      - name: Unit tests
        run: ./gradlew test --no-daemon

      - name: Build
        run: ./gradlew build -x test --no-daemon
